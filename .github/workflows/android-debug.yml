name: Build StudyForge testing APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.5'
          channel: stable
          cache: true
      - run: sudo apt-get update && sudo apt-get install -y libsqlite3-0
      - run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0' 'ndk;27.0.12077973'
      - run: flutter pub get
      - run: dart format --output=none --set-exit-if-changed lib test
      - run: flutter analyze
      - run: flutter test
      - run: flutter build apk --debug
      - name: Prepare testing download
        run: |
          cp build/app/outputs/flutter-apk/app-debug.apk StudyForge-debug.apk
          sha256sum StudyForge-debug.apk > SHA256SUMS.txt
          stat --printf='%s bytes\n' StudyForge-debug.apk > APK-SIZE.txt
      - uses: actions/upload-artifact@v4
        with:
          name: StudyForge-debug
          path: |
            StudyForge-debug.apk
            SHA256SUMS.txt
            APK-SIZE.txt
          retention-days: 14
